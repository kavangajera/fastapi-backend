version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: queuerx-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: queuerx
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    restart: always
    ports:
      - "3000:3000"
    command:
      - "gotenberg"
      - "--api-port=3000"

volumes:
  mysql_data:
