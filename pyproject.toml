[project]
name = "vercel-fastapi-starter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "aiokafka>=0.12.0",
  "alembic>=1.18.4",
  "argon2-cffi>=25.1.0",
  "asyncmy>=0.2.11",
  "cryptography>=49.0.0",
  "docx2python>=3.6.2",
  "fastapi>=0.121.0",
  "fastapi-swagger-dark>=0.0.9",
  "greenlet>=3.4.0",
  "jose>=1.0.0",
  "loguru>=0.7.3",
  "numpy>=2.2.6",
  "opencv-python>=4.13.0.92",
  "openai>=1.109.1",
  "openpyxl>=3.1.5",
  "paddleocr>=2.10.0",
  "paddlepaddle>=3.3.1",
  "pandas>=2.3.3",
  "pillow>=12.2.0",
  "pillow-heif>=1.3.0",
  "psycopg2-binary>=2.9.11",
  "pydantic-settings>=2.12.0",
  "pylibdmtx>=0.1.10",
  "pymupdf>=1.27.2.2",
  "pymysql>=1.1.2",
  "python-dateutil>=2.9.0.post0",
  "python-jose>=3.5.0",
  "python-multipart>=0.0.22",
  "pyzbar>=0.1.9",
  "reportlab>=4.5.1",
  "requests>=2.32.5",
  "rich>=15.0.0",
  "sqlalchemy>=2.0.46",
  "stripe>=15.3.1",
  "striprtf>=0.0.32",
  "uvicorn>=0.34.0",
  "xlrd>=2.0.2",
  "zxing-cpp>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "alembic/versions", "__pycache__", "storage", "logs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: import-sort, B: bugbear,
# UP: pyupgrade, ASYNC: blocking-call-in-async-def detector.
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]  # E501 = line length (governed by ruff format),
                            # B008 = function calls in argument defaults
                            # (FastAPI-idiomatic — Depends(), File(), etc.)
